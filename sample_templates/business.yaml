body: |
  This report provides an overview of the company's financial performance
  for the fourth quarter of fiscal year 2024.

  Revenue grew by 12% year-over-year, driven primarily by strong performance
  in the enterprise segment. Operating margins improved to 18.4%, up from
  16.2% in the same period last year.

  Key highlights include the successful launch of three new product lines,
  expansion into two new geographic markets, and the completion of our
  strategic acquisition of TechStart Inc.

  Looking ahead to 2025, we anticipate continued growth supported by our
  expanded product portfolio and strengthened market position.
